name: Issue closure tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Run deterministic closure fixtures without a write token
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_verified_issue_closure.py' -v
